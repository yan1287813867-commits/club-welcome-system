server.address=127.0.0.1
server.port=${PORT:8080}
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=16KB
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.web.resources.static-locations=file:./site/,classpath:/static/
spring.web.resources.cache.cachecontrol.no-store=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.stream-read-constraints.max-string-length=16384
logging.level.root=INFO
server.tomcat.accesslog.enabled=false
